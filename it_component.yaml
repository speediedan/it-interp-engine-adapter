it_schema_version: 1
kinds: [adapters]

adapters:
  entrypoint: src/interp_engine_adapter.py
  declares: [interp_engine]
  compositions:
    - component: module
      adapters: [core, interp_engine]
    - component: module
      adapters: [lightning, interp_engine]

requires:
  # interp-engine's 1.x line changes signatures between minors with no deprecation aliases, by
  # design (it prefers load-time errors over silently wrong engines). `~=1.3` is therefore a
  # correctness pin rather than caution, and every engine symbol is reached through one seam below
  # so a 1.4 rename is a one-file change.
  # NOTE the ".dev0": `>=0.1.0` EXCLUDES `0.1.0.devN`, because a dev release sorts BEFORE its own
  # final. So the obvious spelling locks out everyone developing interpretune at the version the
  # component was written against -- which is every contributor. Caught by loading it, 2026-08-28.
  interpretune: ">=0.1.0.dev0"
  pip:
    # NOTE the trailing ".0": `~=1.3` would admit 1.4, which is precisely the break this pin
    # exists to prevent. Caught by a resolver dry run on 2026-08-28, which offered 1.4.0 against a
    # pin whose comment says it holds the 1.3 line. `~=1.3.0` is >=1.3.0, ==1.3.*.
    - "interp-engine~=1.3.0"
