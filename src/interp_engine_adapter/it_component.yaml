it_schema_version: 1
kinds: [adapters]

adapters:
  entrypoint: adapter.py
  declares: [interp_engine]
  # BOTH COMPONENT SLOTS PER COMPOSITION, because both are registered and an entry's identity is
  # (component, *adapters) -- the component name is not decoration.
  #
  # This listed only the `module` slots until the datamodule registration landed, and NOTHING FAILED.
  # The rails' registration invariant compares adapter SETS and drops the component name, so a manifest
  # that understates its slots loads cleanly. The published card then renders every row as `module`, and
  # a reader comparing components concludes this one supplies no datamodule. Overstating fails at load;
  # understating is the direction nothing checks, which is the direction worth stating deliberately.
  compositions:
    - component: module
      adapters: [core, interp_engine]
    - component: datamodule
      adapters: [core, interp_engine]
    - component: module
      adapters: [lightning, interp_engine]
    - component: datamodule
      adapters: [lightning, interp_engine]
    # CONDITIONAL, and the `requires` is what keeps this manifest honest. Without it the manifest would
    # advertise six compositions to every reader while an environment without circuit-tracer yields
    # four, with nothing saying so -- the declarative version of exactly the silent loss the rails'
    # per-composition skip reporting exists to remove. The rails evaluate this and hand the entrypoint
    # the satisfiable set; `register_adapter_ctx` registers that set and no more.
    - component: module
      adapters: [core, interp_engine, circuit_tracer]
      requires:
        pip: ["circuit-tracer"]
    - component: datamodule
      adapters: [core, interp_engine, circuit_tracer]
      requires:
        pip: ["circuit-tracer"]

requires:
  # interp-engine's 1.x line changes signatures between minors with no deprecation aliases, by
  # design (it prefers load-time errors over silently wrong engines). `~=1.5.1` is therefore a
  # correctness pin rather than caution, and every engine symbol is reached through one seam below
  # so a 1.6 rename is a one-file change.
  # NOTE the ".dev0": `>=0.1.0` EXCLUDES `0.1.0.devN`, because a dev release sorts BEFORE its own
  # final. So the obvious spelling locks out everyone developing interpretune at the version the
  # component was written against -- which is every contributor. Caught by loading it, 2026-08-28.
  interpretune: ">=0.1.0.dev0"
  pip:
    # NOTE the trailing patch digit: `~=1.11` would admit 1.12, which is precisely the break this pin
    # exists to prevent. `~=1.11.1` is >=1.11.1, ==1.11.*, so it takes 1.11.x fixes and stops at 1.12. The
    # floor is 1.11.1 rather than 1.11.0 because 1.11.0 was already superseded when this line moved.
    #
    # Moved from `~=1.5.1` after validating against 1.11.1 (interpretune#600; the 1.5 line predated the
    # mHC point set and the hyper-connection names now in `mappers.py`). The seam's contract tests assert
    # against the INSTALLED engine -- STEER_METHODS membership, `EagerModel.capture`'s parameter ORDER,
    # `tlens_hook_to_point` resolving model-blind, `SteerSpec` accepting a (k, d) operand -- which is
    # exactly the surface a minor bump moves, so they are the validation rather than an obstacle to it.
    #
    # This pin is the effective CEILING for circuit-tracer too, not only for this component:
    # circuit-tracer's own floor is `>=1.3.3` and admits far more, so whoever moves this line moves
    # what that package resolves as well.
    - "interp-engine~=1.11.1"
