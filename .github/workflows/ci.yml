name: tests

# This component owns its own correctness. Interpretune's core suite tests the RAILS against a
# fixture adapter and carries one optional contract test against the published component; it does
# not test this adapter's behaviour, so an interp-engine release that moves a signature turns this
# repo red rather than a framework nobody expects to break.
#
# Two jobs, as a model for hub-component CI:
#   cpu — hosted runner, every push/PR. Interpretune is installed from its GitHub source repo
#         (it is pre-MVP and not on PyPI); uv is used so a future consumer inheriting
#         interpretune's [tool.uv] override workflow stays a one-line change.
#   gpu — manual dispatch on a self-hosted runner carrying the `gpu` label. Hub contributors with
#         GPU hardware register a runner and dispatch this to exercise device-dependent paths;
#         without such a runner the job simply never runs and never blocks a merge.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          # The pinned engine line, plus interpretune (from source; not yet on PyPI) for the
          # registration surface the entrypoint uses. CPU torch keeps the hosted runner light.
          #
          # NO transformer-lens / sae-lens hand-carry. They were carried until interpretune#401's
          # follow-up (merged as c3423a5) declared jaxtyping and moved the analysis stack's module-level
          # sae_lens import behind TYPE_CHECKING. transformer-lens had been silently supplying jaxtyping,
          # which is why the pair had to be dropped together and why no in-repo env could reveal it.
          # If a future interpretune reintroduces an undeclared import, this job fails at import rather
          # than being masked by a pin here, which is the outcome worth having.
          uv pip install --system --torch-backend=cpu -e ".[test]" \
            "interpretune @ git+https://github.com/speediedan/interpretune.git@main"
      - name: Test
        run: pytest -v

  gpu:
    # Runs only when dispatched, and only on a self-hosted runner labelled `gpu`.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e ".[test]" \
            "interpretune @ git+https://github.com/speediedan/interpretune.git@main"
      - name: Test (GPU)
        run: |
          nvidia-smi
          IT_RUN_CUDA_TESTS=1 pytest -v
