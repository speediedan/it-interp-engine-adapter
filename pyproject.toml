[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "it-interp-engine-adapter"
version = "0.1.0"
description = "Hub-delivered Interpretune adapter for interp-engine"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["interp-engine~=1.5.1"]

# THE FORK PIN LIVES IN THE TEST EXTRA, NOT IN `dependencies`, and that placement is the whole design.
#
# `tests/test_engine_mapper_contract.py` proves the pre-norm/post-norm defect is real by routing through
# the engine's own `tlens_hook_to_point`, so it is RED on the released engine and GREEN on the fork
# carrying the refusal. Proving that needs the fork installed; SHIPPING it to consumers does not.
#
# Putting the fork in `dependencies` would push a personal fork of a third-party library onto everyone
# who pip-installs this adapter, to buy them nothing: `_Seam.point_for` already refuses those hook names
# regardless of what the engine does, so a consumer on the released engine is protected by this
# component either way. The fork buys evidence, and evidence belongs in the test extra.
#
# RETIRING IT IS ONE LINE. When the fix lands upstream and the released engine refuses these hooks, drop
# this entry and the contract test keeps passing unchanged, because it asserts the CORRECT BEHAVIOUR
# rather than the presence of a fork. A fork pin left in place is how a fork becomes a maintenance
# surface (AGENTS.md); this one is built to be removable without touching a test.
[project.optional-dependencies]
test = [
    "pytest",
    "interp-engine @ git+https://github.com/speediedan/interp-engine.git@fix/prenorm-block-hooks-are-refused",
    # WHAT INTERPRETUNE'S CONFORMANCE SUITE NEEDS AND DOES NOT DECLARE. The suite ships inside
    # interpretune, so an adopter reasonably expects installing interpretune to be enough. It is not:
    # the suite's session builds a datamodule that reaches `evaluate`, and the metric script `evaluate`
    # downloads imports `sklearn.metrics` at module level, where no static check of either tree can see
    # it. Both live in interpretune's `examples` extra, which is scoped to running the shipped notebooks,
    # so nothing an adopter would think to install pulls them.
    #
    # Measured, not guessed: without these the whole conformance file ERRORS at setup with
    # `No module named 'evaluate'`, 16 errors and the plugin's own vacuity guard firing. That guard is
    # what turns it into a red rather than a quiet skip, which is the behaviour worth having -- but the
    # dependency still has to be declared somewhere, and until the suite declares it, here is somewhere.
    "evaluate",
    "scikit-learn",
]

# A PACKAGE rather than a flat module, and the manifest ships as package data inside it. That is what
# lets the pip-install path and the hub path resolve the SAME `it_component.yaml` through one predicate,
# instead of one of them answering a weaker question.
#
# Do NOT ship the manifest via `[tool.setuptools.data-files]`. Measured: it lands at `<prefix>/`, the
# install ROOT, so every component publishing a manifest that way overwrites the last one installed, and
# a lookup then answers plausibly for a different component entirely.
#
# The entrypoint is `adapter.py`, not `__init__.py`: the loader stages and executes whatever
# `adapters.entrypoint` names, and a published repo carrying `adapter.py` reads better than one carrying
# `__init__.py`. `__init__.py` re-exports it for the pip path and the loader never executes it, which is
# why that file may import a sibling while the entrypoint may not.
[tool.setuptools]
package-dir = { "" = "src" }
packages = ["interp_engine_adapter"]

[tool.setuptools.package-data]
interp_engine_adapter = ["it_component.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F"]
# E731 (lambda assignment) and F722 (forward-annotation syntax) are ignored for jaxtyping
# compatibility, matching interpretune so a contributor moving between the repos meets one style.
ignore = ["E731", "F722"]
mccabe.max-complexity = 10

[tool.ruff.format]
# Ruff 0.14+ formats Python code blocks inside Markdown; the pinned pre-commit hook (v0.12.10) does
# not. Without this the CLI and the hook disagree on README.md, and the CLI "fix" would collapse the
# deliberate comment alignment in the quickstart block. Excluded so both agree.
exclude = ["*.md"]
