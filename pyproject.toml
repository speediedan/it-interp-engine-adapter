[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "it-interp-engine-adapter"
version = "0.1.0"
description = "Hub-delivered Interpretune adapter for interp-engine"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["interp-engine~=1.3.0"]

[project.optional-dependencies]
test = ["pytest"]

# A single top-level MODULE under src/ is not auto-discoverable: setuptools' src-layout autodiscovery
# finds packages (directories with an __init__.py), and this component is deliberately one flat file
# because the hub loader executes the entrypoint as a standalone file. So both halves are stated
# explicitly -- without them `pip install -e .` builds a distribution containing no importable module
# at all, and the failure surfaces as an ImportError in the tests rather than at install time.
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["interp_engine_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F"]
# E731 (lambda assignment) and F722 (forward-annotation syntax) are ignored for jaxtyping
# compatibility, matching interpretune so a contributor moving between the repos meets one style.
ignore = ["E731", "F722"]
mccabe.max-complexity = 10

[tool.ruff.format]
# Ruff 0.14+ formats Python code blocks inside Markdown; the pinned pre-commit hook (v0.12.10) does
# not. Without this the CLI and the hook disagree on README.md, and the CLI "fix" would collapse the
# deliberate comment alignment in the quickstart block. Excluded so both agree.
exclude = ["*.md"]
