# Self-hosted GPU tests for the interp-engine adapter.
#
# WHY THIS EXISTS ALONGSIDE .github/workflows/ci.yml
#
# `ci.yml`'s `cpu` job is the gate that runs on every push. Its `gpu` job is deliberately inert: it is
# `workflow_dispatch`-only against `runs-on: [self-hosted, gpu]`, and exists as the shape a HUB
# CONTRIBUTOR with their own GPU runner would use. There is no GitHub Actions self-hosted runner on the
# maintainer's hosts, so that job never runs here and is not the route to GPU coverage for this repo.
#
# This pipeline is that route. It runs on the same self-hosted Azure agents interpretune and
# finetuning-scheduler use, which is where the GPUs actually are.
#
# PATH FILTERS AND PULL REQUESTS -- read before assuming a docs push will be skipped.
#
# For a `pr:` trigger these filters are evaluated against the PULL REQUEST's cumulative diff, not the
# delta of the push that fired it, because a pipeline validates the merge commit. So once a PR touches
# `src/**`, every later push re-triggers it, including a docs-only one. `[skip ci]` does not rescue
# this: Microsoft documents that PR pipelines run on the merge commit regardless of skip tokens, which
# suppress only CI/branch triggers. What the filters DO buy is skipping a PR whose ENTIRE diff is
# documentation, which is why the exclusions are stated rather than left implicit.
# NO `main` IN THE CI TRIGGER (2026-09-28). A post-merge main build re-ran trees that the merged PR's gate
# had just validated on its merge ref: several such builds queued per day, each costing a full GPU slot
# or a manual rejection. Main is validated by the PR gates (run on the merge commit), release/tag builds,
# and a MANUAL run (`az pipelines run --branch main`) queued when it adds coverage and an agent is idle.
trigger:
  branches:
    include:
      - release/*
      - refs/tags/*
  paths:
    include:
      - src/**
      - tests/**
      - pyproject.toml
      - .azure-pipelines/**
      - scripts/gpu_lease_wrap.sh
    exclude:
      - docs/**
      - "*.md"

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - tests/**
      - pyproject.toml
      - .azure-pipelines/**
      - scripts/gpu_lease_wrap.sh
    exclude:
      - docs/**
      - "*.md"
  drafts: false # only for PRs that are ready for review

parameters:
  # ANY VENDOR (2026-11-18, maintainer: the adapter pipeline should not require the NVIDIA host). Every triggered build
  # runs on whichever GPU agent is free, NVIDIA (speediedl) or AMD (speedieamd). Until this change the job demanded
  # `GPU_VENDOR -equals nvidia` (PR #49, "until the AMD agent is admitted"), so every adapter gate queued behind
  # interpretune's on the one NVIDIA agent while the AMD agent sat idle (measured 2026-11-17: gate 2109 approved and
  # undispatched behind 2098). A manual run may still pin one vendor's agent with this parameter, which is the route for
  # a one-off check that needs NVIDIA (or AMD) specifically.
  #
  # A test that genuinely cannot run on ROCm carries the `nvidia_only` marker (tests/conftest.py) and its issue, and is
  # skipped on an AMD agent. None does today: the suite reaches devices through `torch.accelerator` / `torch.cuda`, both
  # vendor-neutral, and nothing here calls circuit-tracer's `head_loadings`, the path speediedan/interpretune#1001
  # (ROCm 10.0 hipBLASLt over-read, fixed in ROCm 10.1) faults. When a marked test does appear, run it on NVIDIA as
  # well: either pin `vendor: nvidia` for that check, or add a second job from the same template with `vendor: nvidia`,
  # `jobClass: ci-vendor-marked` and `-m nvidia_only`, so a gate that lands on AMD does not leave it unrun.
  - name: vendor
    displayName: GPU vendor
    type: string
    default: any
    values:
      - any
      - nvidia
      - amd
  # The images each vendor's agent runs, digest-pinned (the template refuses an undigested one): interpretune's own
  # (its .azure-pipelines/gpu-tests.yml `images`), built by its dockers/docker_images_main.sh. This job installs
  # interpretune @ main into them, so they move with interpretune's: bump both digests together when interpretune does.
  - name: images
    type: object
    default:
      nvidia: "speediedan/interpretune:py3.13-pt2.15.0-azpl-init@sha256:fda1c1cd8373da860e38d9aaea5bd1a096dbc1ed886043a3c8054d2b0c7bd7e8"
      amd: "speediedan/interpretune:py3.13-pt2.15.0-rocm10.0-azpl-init@sha256:bd6ef05d876cea67c58b6f108a4ea300227f6272843a8f246c172c7689307283"

# The any-vendor GPU job template interpretune and finetuning-scheduler share, pinned to the gpu-epsilon tag interpretune
# uses. It picks the image and device options from the vendor the agent declares (an Azure `container:` resource is
# fixed before the agent is known, which is why this is now a host job that starts its own container), checks the
# digest pin, mounts the checkout, the host lease directory at /gpu_leases and the host's lease tool, and removes the
# container at the end. This job is interpretune-family work, so it takes interpretune's project capability (`ci-it`,
# which both agents carry) and its variable prefix (`IT`); its container is named `it-<build>-<attempt>-adapter_gpu`.
resources:
  repositories:
    - repository: ci
      type: github
      name: speediedan/gpu-epsilon
      endpoint: speediedan
      ref: refs/tags/gpu-job-v1

jobs:
  - template: templates/gpu-job.yml@ci
    parameters:
      jobName: adapter_gpu
      displayName: GPU tests (${{ parameters.vendor }} vendor)
      vendor: ${{ parameters.vendor }}
      jobClass: ci-any-vendor
      project: ci-it
      images: ${{ parameters.images }}
      variablePrefix: IT
      artifactPrefix: it
      # Install (two git installs plus circuit-tracer) and the suite take about 20 minutes; the lease wait below can
      # add 40. The container sleeps five minutes past this, so one leaked by an agent crash exits on its own.
      timeoutInMinutes: 75
      workspaceClean: outputs
      # The agent's HF cache, created on first use on an agent that has never run this job.
      hostPrep: |
        hf_cache="/opt/az_pipeline_agent/_work/hf_cache/$(Agent.Name)"
        mkdir -p "$hf_cache"
      containerOptions: |
        -v "${hf_cache}:/opt/hf_cache:rw"
        -e HF_HOME=/opt/hf_cache -e HF_DATASETS_CACHE=/opt/hf_cache/datasets
        -e HF_HUB_CACHE=/opt/hf_cache/hub -e XDG_CACHE_HOME=/opt/hf_cache
      # Run by the template's `always()` cleanup before it removes the container, so a failed or cancelled build still
      # releases. Removing the container would free the flock anyway (the kernel drops the lock with its holder), but
      # the holder METADATA file is removed here, and a stale holder is what makes `--status` misattribute a hold.
      releaseCommand: bash .azure-pipelines/scripts/ctr.sh 'source scripts/gpu_lease_wrap.sh && ci_gpu_lease_release /gpu_leases /tmp/azp_gpu_lease.pid'
      steps:
        # Serialize against local GPU work on this host. Waiting here for tens of minutes is the system working, not a
        # hung build: do not cancel, and never force-reset the lease from the host side. See the `gpu-lease` and
        # `az-pipelines-ops` skills. The lock is the host's whole-server `gpu.lock`, the same contract on both agents.
        - bash: |
            bash .azure-pipelines/scripts/ctr.sh 'source scripts/gpu_lease_wrap.sh && ci_gpu_lease_acquire /gpu_leases /tmp/azp_gpu_lease.pid 2400 "azure-iea-${BUILD_BUILDID}"'
          displayName: "Acquire host GPU lease"

        - bash: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/install.sh'
          displayName: "Install"

        - bash: bash .azure-pipelines/scripts/ctr.sh 'python .azure-pipelines/scripts/warm_seed.py'
          displayName: "Warm the conformance seed component"
          env:
            HF_TOKEN: $(HF_MCP_TOKEN_RW)

        # Backend truth before the suite: the torch build must match the vendor the agent reported, with its devices
        # visible. Vendor-neutral: `torch.cuda` is the device API on a ROCm torch too.
        - bash: |
            bash .azure-pipelines/scripts/ctr.sh 'python - <<"PY"
            import os
            import torch
            expected = os.environ["IT_GPU_VENDOR"]
            actual = "amd" if torch.version.hip else "nvidia" if torch.version.cuda else "cpu"
            assert actual == expected, (expected, actual, torch.__version__)
            assert torch.cuda.is_available(), "no GPU device visible to this job"
            print({"torch": torch.__version__, "cuda": torch.version.cuda, "hip": torch.version.hip,
                   "devices": [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())]})
            PY'
          displayName: "Verify GPU backend and visibility"

        - bash: bash .azure-pipelines/scripts/ctr.sh 'bash .azure-pipelines/scripts/test_gpu.sh'
          displayName: "Test (GPU)"
          env:
            # Approved: the conformance seed loads the Hub RTE component (interpretune inputs SEED_REPO), so this job
            # opts into executing that pinned component's entrypoint. The warm step only fetches; without this the
            # suite refuses every seed-backed case by name.
            IT_TRUST_REMOTE_CODE: "1"
